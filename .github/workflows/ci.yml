name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_MODE: mock
      GEMINI_LIVE_REQUESTS_ENABLED: "false"
      NEXT_PUBLIC_SUI_NETWORK: testnet
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.15.1
      - name: Install dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit generated lockfile on same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "Lockfile already committed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Commit pnpm lockfile"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium for smoke test
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:smoke
